[package]
name = "rdm-core"
version.workspace = true
edition.workspace = true

[dependencies]
rdm-torrent = { path = "../torrent" }
rdm-engine = { path = "../engine" }
rdm-media = { path = "../media" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
trash = "5"
url = "2"
sha2 = "0.10"
zip = "2"
sevenz-rust = "0.6"
monolith = { version = "2.11", default-features = false }
reqwest.workspace = true

# Linux: ffmpeg comes as a .tar.xz (xz2 is already built for zip).
[target.'cfg(not(windows))'.dependencies]
tar = "0.4"
xz2 = "0.1"

[dev-dependencies]
librqbit = { version = "9.0.1", default-features = false, features = ["default-tls"] }
tokio = { workspace = true, features = ["test-util"] }
axum.workspace = true
tempfile.workspace = true
futures-util.workspace = true
