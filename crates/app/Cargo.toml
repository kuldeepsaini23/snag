[package]
name = "rdm-app"
version.workspace = true
description = "Download manager for files, videos, music, image galleries and torrents"
edition.workspace = true

[[bin]]
name = "snag"
path = "src/main.rs"

[dependencies]
percent-encoding.workspace = true
rdm-core = { path = "../core" }
rdm-media = { path = "../media" }
rdm-bridge = { path = "../bridge" }
rdm-engine = { path = "../engine" }
iced = { version = "0.14", features = ["tokio", "image", "qr_code", "canvas"] }
tokio.workspace = true
futures-util.workspace = true
chrono.workspace = true
serde_json.workspace = true
# Thumbnails of downloaded pictures (iced already builds it for its image widget).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
window-vibrancy = "0.8.1"
sha1_smol = "1.0.1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"
tray-icon = "0.26.0"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

# Linux: no GTK. The tray icon is a StatusNotifierItem and notifications go over D-Bus; the
# folder picker asks the desktop portal (zenity without one).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }
notify-rust = "4"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# macOS: notifications through the Notification Center; the application delegate (Dock clicks,
# Quit) with the same objc2 crates tray-icon uses.
[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = "4"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
winresource = "0.1.31"

# `cargo deb -p rdm-app` (packaging/linux/build.sh): snag_<version>_amd64.deb.
[package.metadata.deb]
name = "snag"
maintainer = "Kuldeep Saini <89005887+kuldeepsaini23@users.noreply.github.com>"
copyright = "2026, Kuldeep Saini"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A fast, free download manager with a browser extension that catches videos: \
files over up to 8 connections with pause and resume, videos and music from 1,800+ sites \
through yt-dlp, image galleries, torrents and whole web pages."""
section = "net"
priority = "optional"
revision = ""
# $auto: what the binary links (glibc). The window loads X11 and xkbcommon at run time (dlopen),
# so they're named here; xdg-open opens files and folders.
depends = "$auto, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2, libxkbcommon0, libxkbcommon-x11-0, xdg-utils"
assets = [
    ["target/release/snag", "usr/bin/", "755"],
    ["../../packaging/linux/snag.desktop", "usr/share/applications/", "644"],
    ["assets/logo/snag-64.png", "usr/share/icons/hicolor/64x64/apps/snag.png", "644"],
    ["assets/logo/snag-128.png", "usr/share/icons/hicolor/128x128/apps/snag.png", "644"],
    ["assets/logo/snag-256.png", "usr/share/icons/hicolor/256x256/apps/snag.png", "644"],
    ["../../packaging/linux/snag-512.png", "usr/share/icons/hicolor/512x512/apps/snag.png", "644"],
]
