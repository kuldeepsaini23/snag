[package]
name = "rdm-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "snag"
path = "src/main.rs"

[dependencies]
rdm-core = { path = "../core" }
rdm-media = { path = "../media" }
rdm-bridge = { path = "../bridge" }
rdm-engine = { path = "../engine" }
iced = { version = "0.14", features = ["tokio", "image", "qr_code", "canvas"] }
tokio.workspace = true
futures-util.workspace = true
chrono.workspace = true
serde_json.workspace = true
# Thumbnails of downloaded pictures (iced already builds it for its image widget).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
tray-icon = "0.26.0"
tauri-winrt-notification = "0.8.1"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
window-vibrancy = "0.8.1"
sha1_smol = "1.0.1"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
winresource = "0.1.31"
