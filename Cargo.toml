[workspace]
resolver = "3"
members = ["crates/engine", "crates/media", "crates/torrent", "crates/core", "crates/bridge", "crates/cli", "crates/app"]
exclude = ["vendor"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kuldeepsaini23/snag"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
percent-encoding = "2"
axum = "0.8"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Debug builds (tests): line numbers for our code, no debug info for libraries. Full debug info
# made each test program ~300 MB and the target folder grow by gigabytes per rebuild.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Smaller, faster release builds (the installer ships snag.exe).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# iced's CPU renderer, with Snag's fixes (see vendor/iced_tiny_skia/SNAG.md).
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
