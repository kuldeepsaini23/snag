name: Linux

# Builds and tests Snag on Linux, and packages the AppImage and the .deb as workflow artifacts
# (to try a branch on a Linux machine before it's released). Releases: release-linux.yml.
on:
  push:
    branches: [master, feat/linux]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # The oldest supported Ubuntu, like the release job.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config curl file \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build the AppImage and .deb
        run: bash packaging/linux/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: snag-linux
          path: |
            target/linux/Snag-x86_64.AppImage
            target/linux/snag_*_amd64.deb
            target/linux/SHA256SUMS-linux-*.txt
          if-no-files-found: error
